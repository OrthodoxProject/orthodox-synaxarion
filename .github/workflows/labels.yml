name: Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
      - "tools/labels.ts"
      - "tools/lib/labels.ts"
  workflow_dispatch:

# Labels are written through the issues API.
permissions:
  contents: read
  issues: write

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --omit=dev
      - name: Create, rename and update the labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run labels -- --sync
