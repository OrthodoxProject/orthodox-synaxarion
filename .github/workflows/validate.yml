name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Type-check the tools
        run: npm run typecheck
      - name: Test the validator
        run: npm test
      - name: Validate the data
        run: npm run validate
      - name: Generate this year's calendars
        run: npm run generate
      - name: Build the site
        run: npm run site:build
