name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

# The wiki is a separate git repository; the job's token may push to it.
permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Validate the data
        run: npm run validate
      - name: Generate the wiki
        run: npm run wiki
      - name: Publish the pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          # The wiki holds only generated pages: replace them all.
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp build/wiki/*.md wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update from ${GITHUB_SHA::7}"
          git push -q
